name: Microsoft Store candidate

on:
  push:
    tags:
      - 'store-v*'
  workflow_dispatch:

jobs:
  build-store-candidate:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Store tag
        if: startsWith(github.ref, 'refs/tags/store-v')
        shell: pwsh
        run: node scripts/check-store-config.js --strict --expected $env:GITHUB_REF_NAME.Substring(7)

      - name: Build unsigned non-official AppX candidate
        run: npm run package:store

      - name: Create SHA-256 checksum
        shell: pwsh
        run: Get-FileHash release/VideoCull.Store.*.x64.appx -Algorithm SHA256 | Format-List Hash,Path | Out-File release/VideoCull.Store.SHA256.txt

      - name: Upload non-official candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-NON-OFFICIAL-VideoCull-Store-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/VideoCull.Store.*.x64.appx
            release/VideoCull.Store.SHA256.txt
