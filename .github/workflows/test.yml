name: Test

on:
  # Branches are covered by their pull request; running on both started every check twice.
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI test suite
        run: npm run test:ci

  cache-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check installed runtimes
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath (node -p "require('electron')"))) {
            throw 'npm ci did not install the Electron runtime.'
          }
          if (Test-Path -LiteralPath 'node_modules/better-sqlite3/build') {
            throw 'better-sqlite3 must use its bundled binary without a native rebuild.'
          }

      - name: Run native cache regression tests
        run: npm run test:cache-native
