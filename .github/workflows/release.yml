name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version from tag
        id: vars
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Clean release output
        shell: pwsh
        run: |
          if (Test-Path artifacts/packages) {
            Remove-Item -Path "artifacts/packages/*.exe","artifacts/packages/*.blockmap","artifacts/packages/latest.yml" -Force -ErrorAction SilentlyContinue
          }

      - name: Build installer
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release metadata
        shell: pwsh
        run: |
          $version = '${{ steps.vars.outputs.version }}'
          $expectedExe = "VideoCull.Setup.$version.exe"
          $expectedBlockmap = "VideoCull.Setup.$version.exe.blockmap"
          $latestPath = "artifacts/packages/latest.yml"

          if (-not (Test-Path "artifacts/packages/$expectedExe")) {
            throw "Missing expected installer: artifacts/packages/$expectedExe"
          }

          if (-not (Test-Path "artifacts/packages/$expectedBlockmap")) {
            throw "Missing expected blockmap: artifacts/packages/$expectedBlockmap"
          }

          if (-not (Test-Path $latestPath)) {
            throw "Missing latest.yml"
          }

          $latest = Get-Content $latestPath -Raw
          if ($latest -notmatch "path:\s*$([regex]::Escape($expectedExe))") {
            throw "latest.yml path does not match expected installer name $expectedExe"
          }

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md | tr -d '\r')
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: VideoCull ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
          files: |
            artifacts/packages/VideoCull.Setup.${{ steps.vars.outputs.version }}.exe
            artifacts/packages/VideoCull.Setup.${{ steps.vars.outputs.version }}.exe.blockmap
            artifacts/packages/latest.yml

  build-unix:
    # Runs after the Windows job so it adds files to the release that job created.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            files: |
              artifacts/packages/VideoCull-*.dmg
          - os: ubuntu-latest
            script: package:linux
            files: |
              artifacts/packages/VideoCull-*.AppImage
              artifacts/packages/latest-linux.yml
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add packages to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: ${{ matrix.files }}
