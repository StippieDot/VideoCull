name: Release

# A version tag builds every platform and publishes the release only when all of them succeeded.
# Running it by hand builds the same packages as workflow artifacts and publishes nothing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package
            files: |
              artifacts/packages/VideoCull.Setup.*.exe
              artifacts/packages/VideoCull.Setup.*.exe.blockmap
              artifacts/packages/latest.yml
          - os: macos-latest
            script: package:mac
            files: |
              artifacts/packages/VideoCull-*.dmg
          - os: ubuntu-latest
            script: package:linux
            files: |
              artifacts/packages/VideoCull-*.AppImage
              artifacts/packages/VideoCull-*.deb
              artifacts/packages/latest-linux.yml
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build packages
        run: npm run ${{ matrix.script }}

      - name: Validate Windows update metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedExe = "VideoCull.Setup.$version.exe"
          foreach ($file in @($expectedExe, "$expectedExe.blockmap", 'latest.yml')) {
            if (-not (Test-Path "artifacts/packages/$file")) { throw "Missing artifacts/packages/$file" }
          }
          $latest = Get-Content artifacts/packages/latest.yml -Raw
          if ($latest -notmatch "path:\s*$([regex]::Escape($expectedExe))") {
            throw "latest.yml path does not match expected installer name $expectedExe"
          }

      - name: Keep the packages for the release
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md | tr -d '\r')
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: VideoCull ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            packages/VideoCull.Setup.*.exe
            packages/VideoCull.Setup.*.exe.blockmap
            packages/latest.yml
            packages/VideoCull-*.dmg
            packages/VideoCull-*.AppImage
            packages/VideoCull-*.deb
            packages/latest-linux.yml
